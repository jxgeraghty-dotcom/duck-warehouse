name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check warehouse tests scripts

      - name: Build warehouse + run all tests
        run: dw build --generate

      - name: Source freshness
        # feeds are static sample data, so allow staleness in CI without failing
        run: dw source freshness || true

      - name: Unit + data test suite
        run: pytest -q

      - name: Handoff smoke test (exports load under consumer contracts)
        run: python scripts/handoff_smoke.py
